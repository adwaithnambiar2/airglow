<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Airglow — draw beyond the screen</title><desc id="desc">Lilac, rose, and mint trails weave around a hand on a dark purple background. An illustration of the project's creative drawing concept.</desc>
